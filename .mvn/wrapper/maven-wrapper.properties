wrapperVersion=3.3.4
distributionType=only-script
distributionUrl=https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/4.0.0-rc-5/apache-maven-4.0.0-rc-5-bin.zip
# SHA-256 of apache-maven-4.0.0-rc-5-bin.zip (security analysis 2026-11-10,
# SA43). mvnw refuses a download that does not match. Apache publishes SHA-512
# and an OpenPGP signature only, so this value was computed from an archive
# whose SHA-512 equals the one on archive.apache.org and Maven Central and
# whose signature verifies against https://downloads.apache.org/maven/KEYS.
# Replace it together with distributionUrl, never on its own.
#
# The check needs mvnw 3.3.4 or later on macOS: 3.3.2 calls "sha256sum -c"
# without "-", which the sha256sum that macOS ships in /sbin rejects, so it
# refuses the correct archive as well. Only a fresh download is checked; an
# installed distribution under ~/.m2/wrapper is used as it is.
# The checksum is that of the .zip: on a machine without unzip, mvnw falls back
# to the .tar.gz and stops here.
distributionSha256Sum=966874253b2491c49240eafca01a04dd0d72c96de96e7bdc726248be4e9c33a7
